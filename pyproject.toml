[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "AI Engineering Learning Assistant — production-oriented RAG application"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "langchain-groq>=0.3",
    "langchain-ollama>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces black, flake8, isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (enforce type hints)
    "RUF", # ruff-specific rules
]
ignore = [
    # ANN101 / ANN102 were removed in Ruff >= 0.2 (self/cls are inferred automatically)
]

[tool.ruff.lint.isort]
known-first-party = ["rag_assistant"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
